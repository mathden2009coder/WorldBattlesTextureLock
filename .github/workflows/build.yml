name: Build WorldBattles Texture Lock

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge 1.20.1 mod
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          cat source-archive/part-*.b64 > source-archive/source.zip.b64
          base64 --decode source-archive/source.zip.b64 > source-archive/source.zip
          echo "Archive bytes: $(stat -c%s source-archive/source.zip)"
          unzip -t source-archive/source.zip
          unzip -q source-archive/source.zip -d workspace
          test -f workspace/WorldBattlesTextureLock-Source/build.gradle

      - name: Apply Forge 47.4.28 compatibility patches
        shell: bash
        run: |
          cp patches/ClientPackEvents.java workspace/WorldBattlesTextureLock-Source/src/main/java/com/worldbattles/texturelock/client/ClientPackEvents.java
          grep -q 'import java.util.Comparator;' workspace/WorldBattlesTextureLock-Source/src/main/java/com/worldbattles/texturelock/client/PackInstaller.java || \
            sed -i '/import java.util.Collections;/a import java.util.Comparator;' workspace/WorldBattlesTextureLock-Source/src/main/java/com/worldbattles/texturelock/client/PackInstaller.java

      - name: Target and verify server Forge 47.4.10
        shell: bash
        working-directory: workspace/WorldBattlesTextureLock-Source
        run: |
          sed -i 's/47.4.28/47.4.10/g' build.gradle src/main/resources/META-INF/mods.toml
          grep -n '47.4.10' build.gradle src/main/resources/META-INF/mods.toml
          grep -Eq 'versionRange[[:space:]]*=[[:space:]]*"\\[47\\.4\\.10,' src/main/resources/META-INF/mods.toml

      - name: Build mod
        shell: bash
        working-directory: workspace/WorldBattlesTextureLock-Source
        run: gradle --no-daemon clean build --stacktrace

      - name: Name Forge 47.4.10 JAR
        shell: bash
        working-directory: workspace/WorldBattlesTextureLock-Source
        run: |
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$jar_file"
          mv "$jar_file" build/libs/WorldBattlesTextureLock-Forge-47.4.10.jar
          unzip -p build/libs/WorldBattlesTextureLock-Forge-47.4.10.jar META-INF/mods.toml | grep -E 'modId = "worldbattles_texture_lock"|versionRange.*47\\.4\\.10'

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldBattlesTextureLock-Forge-47.4.10
          path: workspace/WorldBattlesTextureLock-Source/build/libs/WorldBattlesTextureLock-Forge-47.4.10.jar
          if-no-files-found: error
          retention-days: 30
